source = /home/$USER/.cache/wal/colors-hyprland

# monitor = HDMI-A-1,1920x1080@60,0x0,1
# monitor = eDP-1,1920x1200@60,1920x0,1.2
#monitor=,preferred,auto,1

# workspace=1,monitor:HDMI-A-1

$terminal = kitty
$fileManager = thunar
# $menu = wofi --show drun -n
$menu = wofi

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=Hyprland QT_QPA_PLATFORM=wayland
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = kanshi
exec-once = hypridle
exec-once = killall -e xdg-desktop-portal-hyprland
exec-once = killall -e xdg-desktop-portal-kde
exec-once = killall -e xdg-desktop-portal
exec-once = /usr/lib/xdg-desktop-portal-hyprland & sleep 2 && /usr/lib/xdg-desktop-portal & sleep 2 && /usr/lib/xdg-desktop-portal-kde
exec-once = hyprpm reload -n
exec-once = waybar
exec-once = awww-daemon
exec-once = sleep .5 && ~/.config/hypr/Scripts/wallpaper-restore.sh
exec-once = swaync
exec-once = pypr
exec-once = swaync-client -df
exec-once = pactl set-sink-mute @DEFAULT_SINK@ 0
exec-once = /usr/lib/geoclue-2.0/demos/agent 

# The Password Popup Agent
exec-once = /usr/lib/polkit-kde-authentication-agent-1

# The Wallet Daemon (Arch now puts this in /usr/bin)
exec-once = /usr/bin/kwalletd6

# 3. The Backend (Akonadi)
# We add a small sleep to ensure DBus is fully ready before Akonadi starts
exec-once = sleep 2 && akonadictl start


#Setting up clipboard manager
# Store TEXT in cliphist history
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

exec-once = ~/customScripts/start_aw.sh
exec-once = ~/customScripts/startup.sh
exec-once = hyprsunset

# Tell Hyprland which theme to load from your icons folder
env = HYPRCURSOR_THEME,Future-Cyan-Hyprcursor_Theme
env = HYPRCURSOR_SIZE, 36

# Fallback for legacy/GTK apps that don't support hyprcursor yet
env = XCURSOR_THEME,Future-Cyan-Hyprcursor_Theme
env = XCURSOR_SIZE, 36

env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = BROWSER,firefox
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# Environment variables for Wayland/Screensharing
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# Clean and start portals on launch
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user stop xdg-desktop-portal xdg-desktop-portal-hyprland
exec-once = systemctl --user start xdg-desktop-portal xdg-desktop-portal-hyprland

exec-once = wayscriber --daemon

general { 
    
        gaps_in = 2
            gaps_out = 10
            border_size = 0
            col.active_border = $color9
            col.inactive_border = $color5
            resize_on_border = true
            allow_tearing = false
            layout = dwindle
}
decoration {
    rounding = 10
        active_opacity = 0.78
        inactive_opacity = 0.7
        fullscreen_opacity = 1
        blur {
            enabled = true
                size = 3
                passes = 5
                new_optimizations = true
                ignore_opacity = true
                xray = false
                popups = true
        }
    shadow {
        enabled = true
            range = 15
            render_power = 5
            color = rgba(0,0,0,.5)
    }
}
animations {
    enabled = true
    bezier = fluid, 0.15, 0.85, 0.25, 1
    bezier = snappy, 0.3, 1, 0.4, 1
    animation = windows, 1, 3, fluid, popin 5%
    animation = windowsOut, 1, 2.5, snappy
    animation = fade, 1, 4, snappy
    animation = workspaces, 1, 1.7, snappy, slide
    animation = specialWorkspace, 1, 4, fluid, slidefadevert -35%
    animation = layers, 1, 2, snappy, popin 70%
}
dwindle {
    preserve_split = true
}
misc { 
    force_default_wallpaper = -1
    disable_hyprland_logo = true
    focus_on_activate = true
}
input {
    kb_layout = us
        follow_mouse = 1
        sensitivity = 0
        touchpad {
            natural_scroll = true
        }
}
#gestures {
#    workspace_swipe = true
#        workspace_swipe_distance = 300
#        workspace_swipe_cancel_ratio = .05
#        workspace_swipe_min_speed_to_force = 0
#}
device {
    name = epic-mouse-v1
    sensitivity = 0
}
$mainMod = SUPER
bind = $mainMod, D, exec, $terminal
bind = $mainMod, F, killactive
bind = $mainMod, E, exec, $fileManager
# bind = $mainMod, V, exec, hyprctl --batch "dispatch togglefloating; dispatch resizeactive exact 800 800; dispatch centerwindow 1;"
bind = $mainMod, B, togglefloating 
bind = $mainMod, space, exec, $menu
bind = $mainMod, P, pseudo
bind = $mainMod, N, layoutmsg, togglesplit
bind = $mainMod, G, fullscreen
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Switch workspaces (LOCAL to the monitor you're on)
bind = $mainMod, 1, split:workspace, 1
bind = $mainMod, 2, split:workspace, 2
bind = $mainMod, 3, split:workspace, 3
bind = $mainMod, 4, split:workspace, 4
bind = $mainMod, 5, split:workspace, 5
bind = $mainMod, 6, split:workspace, 6
bind = $mainMod, 7, split:workspace, 7
bind = $mainMod, 8, split:workspace, 8
bind = $mainMod, 9, split:workspace, 9
bind = $mainMod, 0, split:workspace, 10

# Move window to workspace (LOCAL)
bind = $mainMod SHIFT, 1, split:movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, split:movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, split:movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, split:movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, split:movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, split:movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, split:movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, split:movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, split:movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, split:movetoworkspacesilent, 10

bind = $mainMod, Left, workspace, -1
bind = $mainMod, Right, workspace, +1

#bind = $mainMod SHIFT, Left, split:movetoworkspacesilent, workspace-1
#bind = $mainMod SHIFT, Right, split:movetoworkspacesilent, workspace+1

bind = $mainMod CTRL, 1, exec, hyprctl --batch "dispatch focusmonitor +1; dispatch split:workspace 1"
bind = $mainMod CTRL, 2, exec, hyprctl --batch "dispatch focusmonitor +1; dispatch split:workspace 2"
bind = $mainMod CTRL, 3, exec, hyprctl --batch "dispatch focusmonitor +1; dispatch split:workspace 3"
bind = $mainMod CTRL, 4, exec, hyprctl --batch "dispatch focusmonitor +1; dispatch split:workspace 4"
bind = $mainMod CTRL, 5, exec, hyprctl --batch "dispatch focusmonitor +1; dispatch split:workspace 5"

bind = $mainMod SHIFT, G, split:grabroguewindows
bind = $mainMod SHIFT, V, exec, rofi -modi emoji -show emoji 
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
bind = ALT, left, movewindow, l
bind = ALT, right, movewindow, r
bind = ALT, up, movewindow, u
bind = ALT, down, movewindow, d 
bind = CTRL, Print, exec, hyprshot -m region -o ~/Screenshots/
bind = , Print, exec, hyprshot -m window -o ~/Screenshots/
bind = ALT, Print, exec, hyprshot -m active -m output -o ~/Screenshots/

#bind = $mainMod, O, exec, hyprlock
bind = $mainMod, O, exec, ~/.local/share/quickshell-lockscreen/lock.sh

bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Swap current workspace with other monitor
bind = $mainMod , X, split:swapactiveworkspaces, current +1

# Swap current workspace with workspace N in current monitor
bind = $mainMod ALT, 1, exec, ~/.config/hypr/Scripts/swap_workspaces.sh 1
bind = $mainMod ALT, 2, exec, ~/.config/hypr/Scripts/swap_workspaces.sh 2
bind = $mainMod ALT, 3, exec, ~/.config/hypr/Scripts/swap_workspaces.sh 3
bind = $mainMod ALT, 4, exec, ~/.config/hypr/Scripts/swap_workspaces.sh 4
bind = $mainMod ALT, 5, exec, ~/.config/hypr/Scripts/swap_workspaces.sh 5
bind = $mainMod ALT, 6, exec, ~/.config/hypr/Scripts/swap_workspaces.sh 6
bind = $mainMod ALT, 7, exec, ~/.config/hypr/Scripts/swap_workspaces.sh 7
bind = $mainMod ALT, 8, exec, ~/.config/hypr/Scripts/swap_workspaces.sh 8
bind = $mainMod ALT, 9, exec, ~/.config/hypr/Scripts/swap_workspaces.sh 9
bind = $mainMod ALT, 0, exec, ~/.config/hypr/Scripts/swap_workspaces.sh 10

bind = ALT, TAB, exec, wlogout -b 2
bind = ALT, w, exec, ~/.config/hypr/Scripts/wallpaper.sh
bind = ALT, a, exec, ~/.config/waybar/scripts/refresh.sh 
bind = ALT, B, exec, ~/.config/waybar/scripts/select.sh
bind = ALT, r, exec, ~/.config/swaync/refresh.sh

#Theme management
bind = $mainMod SHIFT, T, exec, ~/.config/hypr/Scripts/theme-switcher.sh
bind = $mainMod SHIFT, L, exec, ~/.config/hypr/Scripts/lockscreen-picker.sh
bind = $mainMod SHIFT, P, exec, ~/.config/hypr/Scripts/pfp-picker.sh

windowrule = match:class ^(Tk)$, float 1
windowrule = match:class ^(Tk)$, no_blur 1
windowrule = match:class ^(Tk)$, no_focus 1

# ============================================
# Pypr Scratchpad Window Rules
# ============================================

# Term scratchpad
windowrule = float on, match:class ^(kitty-dropterm)$
windowrule = size 65% 60%, match:class ^(kitty-dropterm)$
windowrule = move 17% 6%, match:class ^(kitty-dropterm)$
windowrule = workspace special:scratch_term, match:class ^(kitty-dropterm)$

# Music/Pulsemixer scratchpad
windowrule = float on, match:class ^(kitty-pulsemixer)$
windowrule = size 50% 20%, match:class ^(kitty-pulsemixer)$
windowrule = center on, match:class ^(kitty-pulsemixer)$
windowrule = workspace special:scratch_music, match:class ^(kitty-pulsemixer)$

# Taskbar/btop scratchpad
windowrule = float on, match:class ^(kitty-taskbar)$
windowrule = size 50% 80%, match:class ^(kitty-taskbar)$
windowrule = center on, match:class ^(kitty-taskbar)$
windowrule = workspace special:scratch_taskbar, match:class ^(kitty-taskbar)$

#bind = $mainMod, M, exit
bind = $mainMod, Tab, focusmonitor, +1
bind = $mainMod, R, exec, pypr toggle term
bind = $mainMod, Q, exec, pypr toggle music
bind = $mainMod, T, exec, pypr toggle taskbar
bind = $mainMod, C, exec, pypr expose
#bind = CTRL, ESCAPE, exec, gksu #Dont worry about this

# Screen Utiltities
# Toggle the drawing overlay on/off
bind = $mainMod, Z, exec, wayscriber --daemon-toggle

# Corrected for Hyprland v0.53.0+
layerrule = blur on, match:namespace ^(waybar)$
layerrule = ignore_alpha 0.5, match:namespace ^(waybar)$

layerrule = blur on, match:namespace ^(swaync-control-center)$
layerrule = blur on, match:namespace ^(swaync-notification-window)$
layerrule = ignore_alpha 0.5, match:namespace ^(swaync-control-center)$
layerrule = ignore_alpha 0.5, match:namespace ^(swaync-notification-window)$

layerrule = no_anim on, match:namespace ^(selection)$

bind = CTRL SHIFT, Print, exec, ~/customScripts/latexocr-shot

# QD — Quick Directory Jump (ALT+SPACE, replaces hsearch binding)
bind = ALT, SPACE, exec, kitty --class floating_search_qd zsh -c "~/customScripts/qd.sh"

windowrule = float on,       match:class ^(floating_search_qd)$
windowrule = size 1200 800,  match:class ^(floating_search_qd)$
windowrule = center on,      match:class ^(floating_search_qd)$
windowrule = stay_focused on, match:class ^(floating_search_qd)$

# HSEARCH — File finder (SUPER+ALT+SPACE)
bind = SUPER ALT, SPACE, exec, kitty --class floating_search zsh -c "~/customScripts/hsearch"

windowrule = float on, match:class ^(floating_search)$
windowrule = size 1200 800, match:class ^(floating_search)$
windowrule = center on, match:class ^(floating_search)$
windowrule = stay_focused on, match:class ^(floating_search)$

#clipboard manager
bind = $mainMod, V, exec, ~/customScripts/clipboard_picker.sh

#Hypersunset
binde = SUPER, PRIOR, exec, hyprctl hyprsunset temperature +100
binde = SUPER, NEXT, exec, hyprctl hyprsunset temperature -100
bind = SUPER, HOME, exec, hyprctl hyprsunset reset temperature

QT_QPA_PLATFORM=wayland
XDG_CURRENT_DESKTOP=Hyprland


#plugins
# plugin {
#   hyprsplit {
#     num_workspaces = 10       # per monitor
#     persistent_workspaces = true
#   }
# }
plugin {
    hyprexpo {
        columns = 3
        gap_size = 10
        bg_col = rgb(111111)
        workspace_method = center current # [center/first] [workspace]
        # gesture_distance, enable_gesture, gesture_positive → REMOVED
    }
}

# Optional: 4-finger upswipe to open expo (new syntax)
hyprexpo-gesture = 4, up, expo

bind = $mainMod, a, hyprexpo:expo, toggle

plugin {
    overview {
        # Behavior
        drawActiveWorkspace = true
        reverseSwipe = false     # Reverse touchpad swipe direction

        # Disables the empty "plus" workspace at the end of the list
        showNewWorkspace = false 
        
        # Disables empty workspaces that exist between active ones
        # (e.g., if you have windows on 1 and 3, workspace 2 will be hidden)
        showEmptyWorkspace = false
        
        # Styling
        overrideGaps = true      # Apply different gaps when in overview
        gapsIn = 5
        gapsOut = 10

        # Set this to false to stop windows from shrinking/shifting
        affectStrut = false
        
        # When affectStrut is false, you should also disable overrideGaps
        # to ensure the transition is smooth and doesn't leave ghost gaps
        overrideGaps = false

        # --- Layout & Gaps ---
        panelHeight = 300            # Height of the selector bar
        onBottom = true          # Place the panel at the bottom (false for top)
        workspaceMargin = 12         # Space between workspace previews
        workspaceBorderSize = 2      # Border around previews
        centerAligned = true         # macOS/KDE style centering
        hideBackgroundLayers = true  # Makes the overview cleaner
        
        # --- Aesthetics (Modern Look) ---
        drawActiveWorkspace = true
        panelColor = rgba(1e1e2eff)           # Dark background (Catppuccin Mocha)
        panelBorderColor = rgba(89b4faff)     # Accent color border
        workspaceActiveBorder = rgba(89b4faff)
        workspaceInactiveBorder = rgba(313244ff)
    }
}
# bind = $mainMod, z, overview:toggle, all

# ============================================
# Google Search Popup - Hyprland Configuration
# ============================================
# Add this to your ~/.config/hypr/hyprland.conf
# Updated for Hyprland v0.46+ (new windowrule syntax)

# --- Services ---
exec-once = python3 /home/nuwa/customScripts/google-popup/popup_server.py
exec-once = /home/nuwa/customScripts/google-popup/hypr-popup-handler.sh

# --- Keybinding ---
bind = SUPER SHIFT, space, exec, foot --app-id=google-search --font=monospace:size=12 -e /home/nuwa/customScripts/google-popup/google_search.sh

# --- Search Bar Window Rules (FZF terminal) ---
windowrule = float on, match:class ^(google-search)$
windowrule = size 960 480, match:class ^(google-search)$
windowrule = center on, match:class ^(google-search)$
windowrule = dim_around on, match:class ^(google-search)$
windowrule = no_max_size on, match:class ^(google-search)$

# --- Firefox Popup Rules ---
# Note: Uses firefox.* to match firefox, firefox-nightly, firefox-dev, etc.

# Float windows with [POPUP] in title
windowrule = float on, match:class ^(firefox.*)$, match:title ^(.*\[POPUP\].*)$

# Block fullscreen/maximize requests for [POPUP] windows
windowrule = suppress_event fullscreen maximize, match:class ^(firefox.*)$, match:title ^(.*\[POPUP\].*)$

# Set geometry for [POPUP] windows
windowrule = size 1200 720, match:class ^(firefox.*)$, match:title ^(.*\[POPUP\].*)$
windowrule = center on, match:class ^(firefox.*)$, match:title ^(.*\[POPUP\].*)$

# Suppress maximize/fullscreen requests from ALL Firefox windows (prevents flicker)
windowrule = suppress_event fullscreen maximize, match:class ^(firefox.*)$

# --- Exit Options ---
bind = ALT, Q, exec, hyprctl dispatch killactive
bind = SUPER, M, exec, /home/nuwa/customScripts/google-popup/merge_to_firefox.sh

cursor {
    no_hardware_cursors = true
}
xwayland {
    force_zero_scaling = true
}
